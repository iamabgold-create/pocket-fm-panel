<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket FM Creator Launchpad & Promo Panel</title>
    <style>
        :root {
            --primary: #f7931a;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        h1 { font-size: 1.8rem; color: var(--primary); }
        .wallet-card { background: var(--card-bg); border: 1px solid var(--border); padding: 15px 20px; border-radius: 10px; display: flex; align-items: center; gap: 15px; }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-primary:hover { opacity: 0.9; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .card h3 { margin-bottom: 15px; color: var(--text-main); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
        
        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .hidden { display: none !important; }
        .modal-card { background: var(--card-bg); border: 1px solid var(--border); width: 450px; max-width: 90%; border-radius: 12px; padding: 25px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .btc-conversion-box { background: rgba(247, 147, 26, 0.1); border: 1px solid var(--primary); border-radius: 8px; padding: 15px; text-align: center; margin: 15px 0; }
        .btc-conversion-box h3 { color: var(--primary); font-size: 1.5rem; margin: 5px 0; }
        .qr-section { display: flex; flex-direction: column; align-items: center; margin: 15px 0; }
        .qr-section img { border: 4px solid #fff; border-radius: 8px; background: #fff; width: 160px; height: 160px; }
        .copy-wallet-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .copy-wallet-box input { flex: 1; font-family: monospace; font-size: 0.85rem; }
        .btn-secondary { background: var(--border); color: #fff; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Pocket FM Launchpad</h1>
            <div class="wallet-card">
                <div>
                    <small style="color: var(--text-muted);">Balance</small>
                    <div id="userBalance" style="font-size: 1.2rem; font-weight: bold;">$0.00 USD</div>
                </div>
                <button class="btn-primary" onclick="toggleModal('depositModal')">Top Up BTC ₿</button>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="card">
                <h3>Launch New Promotion Campaign</h3>
                <div class="form-group">
                    <label>Select Package</label>
                    <select id="promoPackage">
                        <option value="100">Pocket FM Listener Jumpstart (10,000 Views) - $100</option>
                        <option value="250">Authentic YouTube Story Teaser (50,000 Views) - $250</option>
                        <option value="500">Serialized Audio Hype Package (120,000 Views) - $500</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Target Link (Pocket FM / YouTube URL)</label>
                    <input type="text" id="targetUrl" placeholder="https://pocketfm.app/..." />
                </div>
                <button class="btn-primary" style="width: 100%;" onclick="startCampaign()">Launch Campaign</button>
            </div>

            <div class="card">
                <h3>Live Campaigns</h3>
                <div id="campaignList" style="color: var(--text-muted); font-size: 0.9rem;">
                    No active campaigns found. Launch your first story promo above!
                </div>
            </div>
        </div>
    </div>

    <!-- BTC TOP-UP MODAL -->
    <div id="depositModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Top Up Balance via Bitcoin</h2>
                <button class="close-btn" onclick="toggleModal('depositModal')">&times;</button>
            </div>
            
            <div class="modal-body">
                <div class="form-group">
                    <label>Enter Amount in USD ($):</label>
                    <input type="number" id="usdDepositAmount" value="50" min="10" oninput="calculateBtcEquivalent()" />
                </div>

                <div class="btc-conversion-box">
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Equivalent BTC to Send:</p>
                    <h3 id="btcCalculatedAmount">Calculating... BTC</h3>
                    <small id="btcRateLabel" style="color: var(--text-muted);">Fetching live BTC price...</small>
                </div>

                <div class="qr-section">
                    <img id="btcQrCode" src="" alt="Bitcoin QR Code" />
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;">Scan QR code or copy address below:</p>
                </div>

                <div class="copy-wallet-box">
                    <input type="text" id="btcWalletAddress" value="bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh" readonly />
                    <button type="button" class="btn-secondary" onclick="copyBtcAddress()">Copy</button>
                </div>

                <div class="form-group">
                    <label>Transaction Hash (TXID) / Proof:</label>
                    <input type="text" id="txidInput" placeholder="Paste your bitcoin TXID hash here..." />
                </div>
            </div>

            <div class="modal-footer" style="margin-top: 20px;">
                <button class="btn-primary" style="width: 100%;" onclick="submitBtcDeposit()">Submit Deposit for Verification</button>
            </div>
        </div>
    </div>

    <script>
        const YOUR_BTC_ADDRESS = "bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh";
        let currentBtcPriceUsd = 0;
        let userWalletBalance = 0.00;

        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.toggle('hidden');
            if(!modal.classList.contains('hidden')) {
                fetchBtcPrice();
            }
        }

        async function fetchBtcPrice() {
            try {
                const res = await fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot');
                const data = await res.json();
                currentBtcPriceUsd = parseFloat(data.data.amount);
                document.getElementById('btcRateLabel').innerText = `1 BTC = $${currentBtcPriceUsd.toLocaleString()}`;
                calculateBtcEquivalent();
            } catch (err) {
                currentBtcPriceUsd = 65000;
                document.getElementById('btcRateLabel').innerText = "Using estimated BTC rate";
                calculateBtcEquivalent();
            }
        }

        function calculateBtcEquivalent() {
            const usdVal = parseFloat(document.getElementById('usdDepositAmount').value) || 0;
            if (currentBtcPriceUsd > 0 && usdVal > 0) {
                const btcVal = (usdVal / currentBtcPriceUsd).toFixed(8);
                document.getElementById('btcCalculatedAmount').innerText = `${btcVal} BTC`;
                const qrUri = `bitcoin:${YOUR_BTC_ADDRESS}?amount=${btcVal}`;
                document.getElementById('btcQrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(qrUri)}`;
            }
        }

        function copyBtcAddress() {
            const addressInput = document.getElementById('btcWalletAddress');
            addressInput.select();
            navigator.clipboard.writeText(addressInput.value);
            alert("Bitcoin address copied to clipboard!");
        }

        function submitBtcDeposit() {
            const txid = document.getElementById('txidInput').value.trim();
            const usdVal = document.getElementById('usdDepositAmount').value;
            if (!txid) {
                alert("Please paste your Bitcoin Transaction Hash (TXID).");
                return;
            }
            alert(`Deposit submitted successfully! Your $${usdVal} balance will update after network confirmation.`);
            document.getElementById('txidInput').value = '';
            toggleModal('depositModal');
        }

        function startCampaign() {
            const url = document.getElementById('targetUrl').value;
            if(!url) {
                alert("Please enter a target link for your promo campaign.");
                return;
            }
            document.getElementById('campaignList').innerHTML = `
                <div style="background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155;">
                    <p style="color: #fff; font-weight: bold;">Status: Delivering 🚀</p>
                    <p style="font-size: 0.8rem; color: #94a3b8; word-break: break-all;">Target: ${url}</p>
                </div>
            `;
            document.getElementById('targetUrl').value = '';
            alert("Campaign launched successfully!");
        }
    </script>
</body>
</html>
